server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Body size cap — covers JSON, multipart, and any other request body
    # at this layer. Backend Multer enforces the per-file ceiling via
    # MAX_UPLOAD_MB; raising both keeps the layers aligned so a >1MB
    # upload no longer fails at nginx with 413 before reaching the API.
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://backend:3001;
    }

    # SPA shell — every fallback route resolves to /index.html. Caching
    # this file past one deploy is what causes "Failed to fetch dynamically
    # imported module" blank screens (cached index.html points at hashed
    # chunks that no longer exist). Setting no-store at the exact-match
    # location ensures the browser re-reads the current chunk-hash map on
    # every navigation, regardless of which deep route triggered the fall-
    # back. Hashed assets below remain immutable — they're content-
    # addressable and safe to cache forever.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires off;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
