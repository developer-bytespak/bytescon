name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # Backend: typecheck + Vitest (with real Postgres + Redis service
  # containers, since integration.test.ts boots the full Express
  # stack against real Prisma per engineering.md Rule 6).
  # =============================================================
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bytescon_user
          POSTGRES_PASSWORD: bytescon_pass
          POSTGRES_DB: bytescon_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytescon_user -d bytescon_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bytescon_user:bytescon_pass@localhost:5432/bytescon_platform_test
      REDIS_URL: redis://localhost:6379
      # Test JWT secret — must be 32+ chars per config.ts production guard,
      # but NODE_ENV=test relaxes that. Still using a long value for safety.
      JWT_SECRET: ci_test_secret_do_not_use_in_production_minimum_32_chars
      NODE_ENV: test
      LOG_LEVEL: error
      # Stub external API keys — tests should not hit live providers.
      STRIPE_SECRET_KEY: sk_test_ci_stub
      STRIPE_WEBHOOK_SECRET: whsec_ci_stub
      ANTHROPIC_API_KEY: ci_stub_key
      ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push schema to test database
        working-directory: backend
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: TypeScript typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Vitest
        working-directory: backend
        run: npm test

  # =============================================================
  # Frontend: typecheck + Vitest + production build.
  # No service containers needed — frontend tests use mocks/MSW.
  # =============================================================
  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Production build needs these set or Vite warns. Stub values are
      # fine for the build to succeed; runtime values come from the host
      # at deploy time via .env.prod.
      VITE_API_URL: http://localhost:3001
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_stub
      VITE_STRIPE_PRICING_TABLE_ID: prctbl_ci_stub

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # Use install rather than ci because the lockfile is currently
        # out of sync with package.json (esbuild 0.28 drift). Once the
        # lockfile is regenerated this can become `npm ci`.
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  # =============================================================
  # Lint (enforcing ratchet — FIX-4 burndown completed 2026-07-03).
  # Zero eslint errors; warnings are capped at the ratchet baseline in
  # frontend package.json (--max-warnings). New errors or warnings fail
  # the job. Lower the baseline as warning debt is paid down.
  # =============================================================
  lint:
    name: Lint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: ESLint (frontend, ratcheted)
        working-directory: frontend
        run: npm run lint


  # =============================================================
  # MCP suite: build + Vitest for the shared lib and all MCP servers,
  # against a real Postgres service container. The servers do not own a
  # Prisma schema — the shared loader walks up to
  # backend/node_modules/@prisma/client, so the client is generated and
  # the schema deployed from backend/. Install order matters: mcp/shared
  # is consumed via file:../shared, so it is installed and BUILT first.
  # =============================================================
  mcp:
    name: MCP suite (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bytescon_user
          POSTGRES_PASSWORD: bytescon_pass
          POSTGRES_DB: bytescon_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytescon_user -d bytescon_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bytescon_user:bytescon_pass@localhost:5432/bytescon_platform_test
      CI: "true"
      NODE_ENV: test
      MCP_LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client + deploy schema
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed static clause catalog
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f mcp/knowledge-mcp/scripts/seed-clause-catalog.sql
        env:
          PGPASSWORD: bytescon_pass

      - name: Install + build mcp/shared
        working-directory: mcp/shared
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install + build servers and gateway
        run: |
          for P in opportunity-mcp knowledge-mcp proposal-mcp bytescon-core-mcp gateway; do
            (cd "mcp/$P" && npm install --no-audit --no-fund && npm run build)
          done

      - name: Test all MCP packages
        run: |
          for P in shared opportunity-mcp knowledge-mcp proposal-mcp bytescon-core-mcp gateway; do
            (cd "mcp/$P" && npx vitest run)
          done
